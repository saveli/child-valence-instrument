[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valence-instrument"
version = "0.1.0.dev0"
description = "Clip-level valence from frozen face/body features and a ridge head (research code)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]
